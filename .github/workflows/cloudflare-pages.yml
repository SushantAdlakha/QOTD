name: Deploy to Cloudflare Pages

# Publishes the static site to Cloudflare Pages on every push.
# Requires two repo secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   a token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  your account id
# Until both are set, this workflow runs as a harmless no-op.

on:
  push:
    branches: ["claude/qotd-trivia-website-140i1b", "main", "master"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard (skip cleanly if secrets are not configured yet)
        id: guard
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "Cloudflare secrets not set yet; skipping deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble static site
        if: steps.guard.outputs.ok == 'true'
        run: |
          mkdir -p dist
          cp index.html styles.css game.js questions.js dist/

      - name: Create Pages project (first run only, ignored if it exists)
        if: steps.guard.outputs.ok == 'true'
        run: npx -y wrangler@3 pages project create qotd --production-branch=production || true

      - name: Deploy to Cloudflare Pages
        if: steps.guard.outputs.ok == 'true'
        run: npx -y wrangler@3 pages deploy dist --project-name=qotd --branch=production --commit-dirty=true
